<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YesSound Privacy Policy</title>
    <script>
        const supportedLanguages = ["zh", "zh-tw", "de", "in", "it", "ru", "tr", "pl", "ja", "ko", "fr", "pt", "ar"];
        const requestedLanguage = new URLSearchParams(window.location.search).get("lang") || "";
        const parts = requestedLanguage.trim().replace(/_/g, "-").toLowerCase().split("-");
        let language = parts[0];

        if (language === "zh") {
            const traditional = !parts.includes("hans") && (
                parts.includes("hant") || parts.some(part => ["tw", "hk", "mo"].includes(part))
            );
            language = traditional ? "zh-tw" : "zh";
        } else if (language === "id") {
            language = "in";
        }

        const target = supportedLanguages.includes(language) ? language : "index_default";
        window.location.replace(target === "index_default" ? "index_default.html" : target + "/");
    </script>
</head>
<body>
    <main>
        <h1>YesSound Privacy Policy</h1>
        <p>If you are not redirected automatically, choose a language below.</p>
        <ul>
            <li><a href="index_default.html" lang="en">English</a></li>
            <li><a href="zh/" lang="zh-Hans">简体中文</a></li>
            <li><a href="zh-tw/" lang="zh-Hant">繁體中文</a></li>
            <li><a href="de/" lang="de">Deutsch</a></li>
            <li><a href="in/" lang="id">Bahasa Indonesia</a></li>
            <li><a href="it/" lang="it">Italiano</a></li>
            <li><a href="ru/" lang="ru">Русский</a></li>
            <li><a href="tr/" lang="tr">Türkçe</a></li>
            <li><a href="pl/" lang="pl">Polski</a></li>
            <li><a href="ja/" lang="ja">日本語</a></li>
            <li><a href="ko/" lang="ko">한국어</a></li>
            <li><a href="fr/" lang="fr">Français</a></li>
            <li><a href="pt/" lang="pt">Português</a></li>
            <li><a href="ar/" lang="ar" dir="rtl">العربية</a></li>
        </ul>
    </main>
</body>
</html>
